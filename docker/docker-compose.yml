# Derived from official Flagsmith OSS compose:
#   https://raw.githubusercontent.com/Flagsmith/flagsmith/main/docker-compose.yml
# Plus official self-hosted MCP server guide:
#   https://docs.flagsmith.com/deployment-self-hosting/mcp-server
#
# Uses Flagsmith's built-in PostgreSQL database for experimentation events
# (EXPERIMENTATION_ENABLED=true, USE_POSTGRES_FOR_ANALYTICS=true), so no
# ClickHouse/Kafka stack is required for evaluation/hackathon volume.

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: secret
  WAREHOUSE_CREDENTIALS_SECRET: secret
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    container_name: flagsmith_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    environment:
      <<: *flagsmith-env
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor

  flagsmith-mcp:
    # Pinned to Flagsmith release tag 2.295.2 (same digest as :latest; 3.4.11 is fastmcp version)
    image: flagsmith/flagsmith-mcp:2.295.2
    restart: unless-stopped
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000
      MCP_SERVER_URL: http://localhost:8002
    ports:
      - 127.0.0.1:8002:8000
    depends_on:
      - flagsmith
